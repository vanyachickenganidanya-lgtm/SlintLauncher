# Copy this file to .github/workflows/release.yml
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: slintlauncher-linux-x64
          - os: windows-latest
            artifact: slintlauncher-windows-x64
          - os: macos-latest
            artifact: slintlauncher-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - id: slint
        uses: ./

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp README.md LICENSE dist/
          if [ -f target/release/slintlauncher.exe ]; then
            cp target/release/slintlauncher.exe "dist/${{ matrix.artifact }}.exe"
            tar -a -cf "${{ matrix.artifact }}.zip" -C dist .
          else
            cp target/release/slintlauncher "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .
          fi

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            slintlauncher-*.tar.gz
            slintlauncher-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
