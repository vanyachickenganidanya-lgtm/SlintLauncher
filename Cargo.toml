[package]
name = "slint-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Fast Minecraft launcher with Ely.by authentication, built with Slint"
license = "GPL-3.0-or-later"
repository = "https://github.com/vanyachickenganidanya-lgtm/SlintLauncher"

[[bin]]
name = "slint-launcher"
path = "src/main.rs"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
