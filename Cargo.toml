[package]
name = "slintlauncher"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Быстрый лаунчер Minecraft на Rust + Slint"
license = "AGPL-3.0-only"
authors = ["SlintLauncher contributors"]
readme = "README.md"
repository = "https://github.com/vanyachickenganidanya-lgtm/SlintLauncher"
keywords = ["minecraft", "launcher", "slint", "game"]
categories = ["games"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
once_cell = "1"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
slint = "1.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
