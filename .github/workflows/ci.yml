name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: slintlauncher-linux-x64
          - os: windows-latest
            artifact: slintlauncher-windows-x64
          - os: macos-latest
            artifact: slintlauncher-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI/build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libxkbcommon-dev \
            libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxkbcommon-x11-dev \
            libwayland-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: slintlauncher

      - name: Unit tests
        run: cargo test --lib --verbose

      - name: Release build
        run: cargo build --release --verbose

      - name: Package Linux / macOS
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          bin="target/release/slintlauncher"
          chmod +x "$bin"
          cp "$bin" "dist/${{ matrix.artifact }}"
          cp README.md LICENSE dist/
          (cd dist && tar -czf "../${{ matrix.artifact }}.tar.gz" .)
          ls -lh "${{ matrix.artifact }}.tar.gz"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/slintlauncher.exe "dist/${{ matrix.artifact }}.exe"
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
